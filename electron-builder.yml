appId: com.workpacer.app
productName: WorkPacer
directories:
  buildResources: build
  output: dist
files:
  - "out/**/*"
  - "resources/**/*"
  - "build/icon.*"
  - "!**/.vscode/*"
  - "!src/*"
  - "!scripts/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,DEV_EDIT_GUIDE.md,USER_GUIDE.md}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,vitest.config.ts,vite.web.config.ts}"
  - "!tests/*"
asarUnpack:
  - "**/*.node"
win:
  icon: build/icon.ico
  executableName: WorkPacer
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: WorkPacer-${version}-Setup-${arch}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
portable:
  artifactName: WorkPacer-${version}-Portable-${arch}.${ext}
mac:
  icon: build/icon.icns
  artifactName: WorkPacer-${version}-${arch}.${ext}
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  extendInfo:
    NSMicrophoneUsageDescription: WorkPacer checks active call status to avoid false idle detection during meetings.
linux:
  icon: build/icon.png
  artifactName: WorkPacer-${version}-${arch}.${ext}
  target:
    - AppImage
    - deb
  maintainer: WorkPacer Team
  category: Utility
npmRebuild: true
